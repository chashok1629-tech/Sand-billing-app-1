
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Sand Management System</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  background:#eee;
  color:#000;
  font-family:Arial,Helvetica,sans-serif;
}

.form{
  max-width:500px;
  margin:0 auto 20px;
  background:#fff;
  padding:15px;
  border-radius:8px;
}

h2{
  text-align:center;
  margin:5px 0 18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:11px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid #aaa;
  border-radius:4px;
  font-size:15px;
  background:#fff;
  color:#000;
}

.qr-title{
  text-align:center;
  font-size:17px;
  margin:20px 0 10px;
  padding:10px 0;
  border-top:1px solid #000;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:5px;
  font-size:15px;
  font-weight:bold;
  background:#126b35;
  color:#fff;
}

button:nth-of-type(2){background:#174b91}
button:nth-of-type(3){background:#555}
button:nth-of-type(4){background:#a32121}

#receipt{
  width:72mm;
  margin:0 auto;
  padding:2mm;
  background:#fff;
  color:#000;
}

.copy{
  width:100%;
  border:1px solid #000;
  padding:2mm;
  margin-bottom:3mm;
  page-break-inside:avoid;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  text-align:center;
  margin-bottom:4px;
}

.header img{
  width:38px;
  height:43px;
  object-fit:contain;
}

.brand{
  text-align:center;
  line-height:1.1;
}

.brand .ap{
  font-weight:bold;
  font-size:19px;
}

.brand .management{
  font-weight:bold;
  font-size:11px;
  margin-top:3px;
}

.copy-title{
  text-align:center;
  font-size:12px;
  font-weight:bold;
  margin:5px 0;
  border-bottom:1px solid #000;
  padding-bottom:4px;
}

.bill-row{
  display:grid;
  grid-template-columns:40% 5% 55%;
  font-size:10px;
  line-height:1.5;
  margin:2px 0;
  overflow-wrap:anywhere;
}

.bill-row .colon{text-align:center}
.bill-row .value{
  text-align:right;
  padding-right:1px;
}

.qr-section{
  text-align:center;
  margin-top:3px;
  padding-top:3px;
  border-top:1px solid #000;
  border-bottom:none;
}

.qr-section img{
  display:block;
  width:1in;
  height:1in;
  object-fit:contain;
  margin:0 auto;
}

@media print{
  @page{
    size:76mm auto;
    margin:2mm;
  }

  body{
    padding:0;
    margin:0;
    background:#fff;
  }

  .form{display:none!important}

  #receipt{
    width:72mm;
    margin:0;
    padding:0;
  }

  .copy{
    break-inside:avoid;
    page-break-inside:avoid;
    margin-bottom:2mm;
  }

  .qr-section{
    border-top:1px solid #000;
    border-bottom:none;
    margin-top:2px;
    padding-top:2px;
  }

  .qr-section img{
    width:1in;
    height:1in;
  }
}
</style>
</head>

<body>

<div class="form">
<h2>Sand Bill Entry</h2>

<label for="orderId">Order Id</label>
<input id="orderId">

<label for="tripNumber">Trip Number</label>
<input id="tripNumber">

<label for="customerName">Customer Name</label>
<input id="customerName">

<label for="customerMobile">Customer Mobile No</label>
<input id="customerMobile" type="tel">

<label for="sandQuantity">Sand Quantity (Tonnes)</label>
<input id="sandQuantity">

<label for="supplyPoint">Sand Supply Point Name</label>
<input id="supplyPoint">

<label for="dispatchDate">Dispatch Date</label>
<input id="dispatchDate" type="date">

<label for="driverName">Driver Name</label>
<input id="driverName">

<label for="driverMobile">Driver Mobile Number</label>
<input id="driverMobile" type="tel">

<label for="vehicleNumber">Vehicle Number</label>
<input id="vehicleNumber">

<label for="address">Address</label>
<input id="address">

<h3 class="qr-title">Registration Details (for QR)</h3>

<label for="registrationId">Registration ID</label>
<input id="registrationId">

<label for="consumerName">Consumer Name</label>
<input id="consumerName">

<label for="consumerMobile">Consumer Mobile No</label>
<input id="consumerMobile" type="tel">

<label for="constructionName">Construction Name</label>
<input id="constructionName">

<label for="registrationDate">Registration Date &amp; Time</label>
<input id="registrationDate" type="datetime-local">

<label for="registrationType">Registration Type</label>
<input id="registrationType" type="text"
       placeholder="Enter Registration Type">

<label for="registrationQty">Registration QTY (in MT)</label>
<input id="registrationQty" type="number" step="any">

<label for="registrationAddress">Registration Address</label>
<input id="registrationAddress">

<button type="button" onclick="previewBill()">Preview Bill</button>
<button type="button" onclick="generateQR()">Generate Registration QR Code</button>
<button type="button" onclick="printBill()">Print 3-inch Bill / PDF</button>
<button type="button" onclick="clearAll()">Clear All</button>
</div>

<div id="receipt">

<div class="copy">
  <div class="header">
    <img src="./3840px-Emblem_of_Andhra_Pradesh.svg.png"
         alt="Andhra Pradesh Emblem"
         onerror="this.style.display='none'">
    <div class="brand">
      <div class="ap">AP SAND</div>
      <div class="management">MANAGEMENT SYSTEM</div>
    </div>
  </div>

  <div class="copy-title">Consumer Copy</div>
  <div id="consumerBill"></div>
</div>

<div class="copy">
  <div class="header">
    <img src="./3840px-Emblem_of_Andhra_Pradesh.svg.png"
         alt="Andhra Pradesh Emblem"
         onerror="this.style.display='none'">
    <div class="brand">
      <div class="ap">AP SAND</div>
      <div class="management">MANAGEMENT SYSTEM</div>
    </div>
  </div>

  <div class="copy-title">Driver Copy</div>
  <div id="driverBill"></div>
</div>

<div class="qr-section">
  <img id="qrImage" alt="Registration QR Code" style="display:none">
</div>

</div>

<script>
const billFields = [
  ["Order Id","orderId"],
  ["Trip No","tripNumber"],
  ["Customer Name","customerName"],
  ["Customer Mobile No","customerMobile"],
  ["Sand Quantity","sandQuantity"],
  ["Sand Supply Point Name","supplyPoint"],
  ["Dispatch Date","dispatchDate"],
  ["Driver Name","driverName"],
  ["Driver Mobile No","driverMobile"],
  ["Vehicle No","vehicleNumber"],
  ["Address","address"]
];

const registrationFields = [
  ["Registration ID","registrationId"],
  ["Consumer Name","consumerName"],
  ["Consumer Mobile No","consumerMobile"],
  ["Construction Name","constructionName"],
  ["Registration Date & Time","registrationDate"],
  ["Registration Type","registrationType"],
  ["Registration QTY (in MT)","registrationQty"],
  ["Registration Address","registrationAddress"]
];

function getValue(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function safeText(value){
  return String(value || "-").replace(/[&<>"']/g, function(ch){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[ch];
  });
}

function makeRows(fields){
  return fields.map(function(field){
    return '<div class="bill-row">' +
      '<span>' + safeText(field[0]) + '</span>' +
      '<span class="colon">:</span>' +
      '<span class="value">' + safeText(getValue(field[1])) + '</span>' +
      '</div>';
  }).join("");
}

function previewBill(){
  document.getElementById("consumerBill").innerHTML =
    makeRows(billFields);

  document.getElementById("driverBill").innerHTML =
    makeRows(billFields);
}

function getRegistrationText(){
  return registrationFields.map(function(field){
    return field[0] + ": " + (getValue(field[1]) || "-");
  }).join("\n");
}

function generateQR(callback){
  const qr = document.getElementById("qrImage");
  const data = getRegistrationText();

  qr.onload = function(){
    qr.style.display = "block";
    if(typeof callback === "function") callback();
  };

  qr.onerror = function(){
    alert("QR Code తయారు కాలేదు. Internet connection తనిఖీ చేసి మళ్లీ ప్రయత్నించండి.");
  };

  qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(data);
}

function printBill(){
  previewBill();

  const qr = document.getElementById("qrImage");

  if(qr.style.display === "block" && qr.complete && qr.naturalWidth > 0){
    window.print();
  }else{
    generateQR(function(){
      window.print();
    });
  }
}

function clearAll(){
  document.querySelectorAll(".form input").forEach(function(input){
    input.value = "";
  });

  document.getElementById("consumerBill").innerHTML = "";
  document.getElementById("driverBill").innerHTML = "";

  const qr = document.getElementById("qrImage");
  qr.removeAttribute("src");
  qr.style.display = "none";
}
previewBill();
</script>

</body>
</html>
