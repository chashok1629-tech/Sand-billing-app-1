<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP SAND MANAGEMENT SYSTEM</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #eeeeee;
  color: #111111;
  font-family: Arial, sans-serif;
}

.header {
  width: 100%;
  background: white;
  border: 2px solid #222;
  padding: 18px 8px;
  text-align: center;
  margin-bottom: 15px;
}

.header h1 {
  margin: 0;
  font-size: clamp(20px, 5vw, 32px);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: 0.5px;
  color: #000;
}

.header p {
  margin: 6px 0 0;
  font-size: 14px;
  font-weight: bold;
}

.form {
  background: white;
  border: 1px solid #999;
  padding: 15px;
  border-radius: 5px;
}

.form h2 {
  text-align: center;
  font-size: 21px;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #777;
  border-radius: 4px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: none;
  border-radius: 5px;
  background: #1558a6;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

@media print {
  body {
    background: white;
    padding: 0;
  }

  .form {
    border: none;
  }

  button {
    display: none;
  }

  input {
    border: none;
    border-bottom: 1px solid black;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>AP SAND MANAGEMENT SYSTEM</h1>
  <p>ANDHRA PRADESH</p>
</div>

<div class="form">
  <h2>SAND BILL - SAMPLE</h2>

  <label>Customer Name</label>
  <input type="text" placeholder="Enter customer name">

  <label>Mobile Number</label>
  <input type="tel" placeholder="Enter mobile number">

  <label>Driver Name</label>
  <input type="text" placeholder="Enter driver name">

  <label>Driver Mobile Number</label>
  <input type="tel" placeholder="Enter driver mobile number">

  <label>Vehicle Number</label>
  <input type="text" placeholder="Enter vehicle number">

  <label>Order Number</label>
  <input type="text" placeholder="Enter order number">

  <label>Sand Quantity</label>
  <input type="text" placeholder="Enter quantity">

  <label>Bill Amount</label>
  <input type="number" placeholder="Enter amount">

  <button onclick="window.print()">PRINT BILL</button>
  <button onclick="location.reload()">RESET</button>
</div>

</body>
</html>
