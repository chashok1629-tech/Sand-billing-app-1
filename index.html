
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP SAND MANAGEMENT SYSTEM</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 10px;
  background: #eee;
  color: #111;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  max-width: 700px;
  margin: auto;
  padding: 18px;
  border: 1px solid #ccc;
}

h1 {
  text-align: center;
  font-size: 25px;
  line-height: 1.1;
  margin: 0;
  font-weight: 900;
}

.head {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.logo {
  width: 65px;
  height: 65px;
  object-fit: contain;
  flex-shrink: 0;
}

.copy {
  text-align: center;
  font-size: 17px;
  font-weight: bold;
  padding: 5px;
  border-bottom: 1px solid #111;
}

.fields {
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  padding-top: 8px;
}

.item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0;
}

.item span:first-child {
  flex: 1;
  font-weight: bold;
}

.item span:last-child {
  flex: 1;
  text-align: right;
  overflow-wrap: anywhere;
}

.address {
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.copybill {
  border: 1px solid #aaa;
  padding: 10px;
  margin-bottom: 15px;
  break-inside: avoid;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 10px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  font-size: 16px;
}

button {
  padding: 12px;
  margin-top: 12px;
  background: #1769aa;
  color: white;
  border: 0;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

.form h2 {
  font-size: 20px;
}

@media print {
  body {
    background: white;
    padding: 0;
  }

  .form, .no-print {
    display: none !important;
  }

  .card {
    border: 0;
    padding: 5px;
    max-width: none;
  }

  .copybill {
    break-inside: avoid;
    margin-bottom: 10px;
  }

  @page {
    size: A4;
    margin: 8mm;
  }
}
</style>
</head>

<body>
<div class="card">

<div class="form">
<h2>ENTER SAND BILL DETAILS</h2>

<label>Order ID</label>
<input id="order" placeholder="Enter Order ID">

<label>Trip Number</label>
<input id="trip" placeholder="Enter Trip Number">

<label>Customer Name</label>
<input id="customer" placeholder="Enter Customer Name">

<label>Customer Mobile Number</label>
<input id="mobile" type="tel" placeholder="Enter Mobile Number">

<label>Sand Quantity (Tons)</label>
<input id="qty" placeholder="Example: 25 Tons">

<label>Sand Supply Point</label>
<input id="point" placeholder="Enter Stock Point">

<label>Dispatch Date</label>
<input id="date" type="datetime-local">

<label>Driver Name</label>
<input id="driver" placeholder="Enter Driver Name">

<label>Driver Mobile Number</label>
<input id="dmobile" type="tel" placeholder="Enter Driver Mobile Number">

<label>Vehicle Number</label>
<input id="vehicle" placeholder="Example: AP31TH8459">

<label>Address</label>
<textarea id="address" placeholder="Enter Full Address"></textarea>

<button type="button" onclick="makeBill()">GENERATE BILL</button>
<button type="button" onclick="window.print()">PRINT / SAVE PDF</button>
<button type="button" onclick="resetBill()">NEW BILL</button>
</div>

<div id="output"></div>
</div>

<script>
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function makeBill() {
  const get = id =>
    document.getElementById(id).value.trim();

  const dateValue = get('date');
  const dispatchDate = dateValue
    ? new Date(dateValue).toLocaleString('en-IN')
    : '';

  const fields = [
    ['Order ID', get('order')],
    ['Trip Number', get('trip')],
    ['Customer Name', get('customer')],
    ['Customer Mobile Number', get('mobile')],
    ['Sand Quantity', get('qty')],
    ['Sand Supply Point', get('point')],
    ['Dispatch Date', dispatchDate],
    ['Driver Name', get('driver')],
    ['Driver Mobile Number', get('dmobile')],
    ['Vehicle Number', get('vehicle')]
  ];

  function bill(copyName) {
    return `
      <section class="copybill">
        <div class="head">
          <img class="logo"
               src="./logo.png"
               alt="Government Logo"
               onerror="this.style.visibility='hidden'">
          <h1>AP SAND<br>MANAGEMENT SYSTEM</h1>
        </div>

        <div class="copy">${copyName}</div>

        <div class="fields">
          ${fields.map(([key, value]) => `
            <div class="item">
              <span>${escapeHTML(key)}</span>
              <span>${escapeHTML(value)}</span>
            </div>
          `).join('')}

          <div class="address">
            <strong>Address:</strong>
            ${escapeHTML(get('address'))}
          </div>
        </div>
      </section>
    `;
  }

  document.getElementById('output').innerHTML =
    bill('CONSUMER COPY') +
    bill('DRIVER COPY');
}

function resetBill() {
  document.querySelectorAll(
    '.form input, .form textarea'
  ).forEach(element => {
    element.value = '';
  });

  document.getElementById('output').innerHTML = '';
}
</script>
</body>
</html>
