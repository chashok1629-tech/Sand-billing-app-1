
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Details - AP Sand</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:15px;
  font-family:Arial,sans-serif;
  background:#f1f3f5;color:#111
}
.container{
  max-width:520px;margin:15px auto;
  padding:20px;background:#fff;
  border-radius:8px;
  box-shadow:0 2px 8px #ccc
}
.header{text-align:center;border-bottom:2px solid #1769aa;padding-bottom:12px}
.header h2{font-size:21px;margin:5px}
.header p{margin:5px;font-size:14px}
h3{font-size:17px;text-align:center}
.item{
  display:grid;grid-template-columns:43% 5% 52%;
  gap:0;padding:11px 0;
  border-bottom:1px solid #ddd;
  font-size:14px;overflow-wrap:anywhere
}
.value{font-weight:bold;overflow-wrap:anywhere}
.status{text-align:center;padding:20px;font-weight:bold}
button{
  width:100%;padding:12px;margin-top:15px;
  border:0;border-radius:5px;background:#1769aa;
  color:white;font-size:15px
}
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h2>AP SAND</h2>
    <p>MANAGEMENT SYSTEM</p>
    <p>Registration Information</p>
  </div>

  <div id="status" class="status">Loading Registration Details...</div>
  <div id="details"></div>

  <button onclick="window.print()">Print Details</button>
</div>

<script>
function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function showDetails(){
  const status=document.getElementById("status");
  const box=document.getElementById("details");

  try{
    const hash=location.hash;
    const prefix="#data=";

    if(!hash.startsWith(prefix)){
      status.textContent="Registration Details link లో సమాచారం లేదు.";
      return;
    }

    const raw=decodeURIComponent(hash.substring(prefix.length));
    const data=JSON.parse(raw);

    const fields=[
      ["Registration ID",data.registrationId],
      ["Consumer Name",data.consumerName],
      ["Consumer Mobile No",data.consumerMobile],
      ["Construction Name",data.constructionName],
      ["Registration Date & Time",data.registrationDateTime],
      ["Registration Type",data.registrationType],
      ["Registration QTY (MT)",data.registrationQty],
      ["Registration Address",data.registrationAddress]
    ];

    status.textContent="";
    box.innerHTML="<h3>Registration Details</h3>";

    fields.forEach(item=>{
      box.innerHTML+=
        '<div class="item"><div>'+escapeHTML(item[0])+
        '</div><div>:</div><div class="value">'+
        escapeHTML(item[1]||"-")+'</div></div>';
    });
  }catch(e){
    status.textContent=
      "వివరాలు తెరవలేకపోయాము. QR కోడ్‌ను మళ్లీ స్కాన్ చేయండి.";
  }
}

showDetails();
</script>
</body>
</html>
