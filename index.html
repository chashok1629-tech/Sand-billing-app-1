
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP SAND MANAGEMENT SYSTEM</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:10px;
  background:#eee;
  color:#111;
  font-family:Arial,sans-serif;
}
.card{
  background:white;
  max-width:700px;
  margin:auto;
  padding:18px;
  border:1px solid #ccc;
}
h1{
  text-align:center;
  font-size:25px;
  line-height:1.1;
  margin:0;
}
.logo{
  width:65px;
  height:65px;
  object-fit:contain;
}
.head{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}
.copy{
  text-align:center;
  font-size:17px;
  padding:5px;
  border-bottom:1px solid #111;
}
.fields{
  font-family:monospace;
  font-size:14px;
  line-height:1.45;
  padding-top:8px;
}
.item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:3px 0;
}
.item span:first-child{flex:1}
.item span:last-child{
  flex:1;
  text-align:right;
  overflow-wrap:anywhere;
}
.address{
  margin-top:6px;
  overflow-wrap:anywhere;
}
.copybill{
  border-bottom:1px solid #111;
  padding-bottom:12px;
}
label{
  display:block;
  font-weight:bold;
  margin-top:10px;
}
input,textarea{
  width:100%;
  padding:10px;
  margin-top:5px;
  font-size:16px;
}
button{
  padding:12px;
  margin-top:12px;
  background:#1769aa;
  color:white;
  border:0;
  border-radius:5px;
  font-size:16px;
}
@media print{
  body{background:white;padding:0}
  .form,.no-print{display:none!important}
  .card{border:0;padding:5px;max-width:none}
  .copybill{break-inside:avoid}
  @page{size:A4;margin:8mm}
}
</style>
</head>
<body>

<div class="card">

<div class="form">
<h2>ఇసుక బిల్లు వివరాలు నమోదు చేయండి</h2>

<label>ఆర్డర్ ఐడి</label>
<input id="order" placeholder="ఆర్డర్ ఐడి">

<label>ట్రిప్ నంబర్</label>
<input id="trip" placeholder="ట్రిప్ నంబర్">

<label>కస్టమర్ పేరు</label>
<input id="customer" placeholder="కస్టమర్ పేరు">

<label>కస్టమర్ మొబైల్ నంబర్</label>
<input id="mobile" placeholder="మొబైల్ నంబర్">

<label>ఇసుక పరిమాణం (టన్నులు)</label>
<input id="qty" placeholder="25 Tons">

<label>ఇసుక సరఫరా కేంద్రం</label>
<input id="point" placeholder="స్టాక్ పాయింట్">

<label>డిస్పాచ్ తేదీ</label>
<input id="date" type="datetime-local">

<label>డ్రైవర్ పేరు</label>
<input id="driver" placeholder="డ్రైవర్ పేరు">

<label>డ్రైవర్ మొబైల్ నంబర్</label>
<input id="dmobile" placeholder="మొబైల్ నంబర్">

<label>వాహన నంబర్</label>
<input id="vehicle" placeholder="AP31TH8459">

<label>చిరునామా</label>
<textarea id="address" placeholder="పూర్తి చిరునామా"></textarea>

<button type="button" onclick="makeBill()">బిల్లు తయారు చేయండి</button>
<button type="button" onclick="window.print()">ప్రింట్ / PDF</button>
<button type="button" onclick="location.reload()">కొత్త బిల్లు</button>
</div>

<div id="output"></div>

</div>

<script>
function makeBill(){
 const get=id=>document.getElementById(id).value.trim();
 const dateValue=get('date');
 const date=dateValue
   ? new Date(dateValue).toLocaleString('en-IN')
   : '';

 const fields=[
 ['Order Id',get('order')],
 ['Trip No',get('trip')],
 ['Customer Name',get('customer')],
 ['Customer Mobile No',get('mobile')],
 ['Sand Quantity',get('qty')],
 ['Sand Supply Point Name',get('point')],
 ['Dispatch Date',date],
 ['Driver Name',get('driver')],
 ['Driver Mobile No',get('dmobile')],
 ['Vehicle No',get('vehicle')]
 ];

 function bill(copy){
   return `
   <section class="copybill">
     <div class="head">
       <div class="logo">
  <img
    src="logo.png"
    alt="Government Logo"
    style="width:100%;height:100%;object-fit:contain;"
    onerror="this.alt='Logo not found';">
</div>
       <h1>AP SAND<br>MANAGEMENT SYSTEM</h1>
     </div>
     <div class="copy">${copy}</div>
     <div class="fields">
       ${fields.map(([k,v])=>`
         <div class="item">
           <span>${k}</span>
           <span>${escapeHTML(v)}</span>
         </div>`).join('')}
       <div class="address">
         Address: ${escapeHTML(get('address'))}
       </div>
     </div>
   </section>`;
 }

 document.getElementById('output').innerHTML=
   bill('Consumer Copy')+
   bill('Driver Copy');
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 }[c]));
}
</script>
</body>
</html>
