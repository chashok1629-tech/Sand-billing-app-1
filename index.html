
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP SAND MANAGEMENT SYSTEM </title>
<style>
body{font-family:Arial,sans-serif;background:#eee;margin:0;padding:12px;color:#111}
.form,.bill{background:white;padding:16px;margin:auto;max-width:600px;border:1px solid #ccc;border-radius:6px}
h2{text-align:center;margin:0;font-size:25px}
h3{text-align:center;margin:8px 0}
.notice{text-align:center;color:#b00020;font-weight:bold;font-size:13px;margin:8px}
label{display:block;font-weight:bold;margin-top:12px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;font-size:16px;border:1px solid #888;border-radius:4px}
button{padding:13px;border:0;border-radius:5px;background:#1769aa;color:white;font-size:16px;margin:12px 4px 0 0}
#result{margin-top:18px}
.bill{border-radius:0;margin-bottom:16px;padding:14px}
.billhead{text-align:center;border-bottom:2px solid #111;padding-bottom:8px}
.brand{font-size:24px;font-weight:bold}
.copy{font-size:18px;margin-top:6px}
.sample{text-align:center;color:#b00020;font-size:12px;font-weight:bold;margin:6px 0}
.line{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-family:monospace;font-size:14px}
.key{flex:1;min-width:0}
.val{flex:1;text-align:right;overflow-wrap:anywhere;min-width:0}
.address{border-top:1px solid #222;margin-top:8px;padding-top:8px;font-family:monospace;font-size:14px;overflow-wrap:anywhere}
@media print{
 @page{size:auto;margin:8mm}
 body{background:white;padding:0}
 .form,.no-print{display:none!important}
 #result{margin:0}
 .bill{max-width:none;border:0;padding:4px;margin:0 0 8mm;page-break-inside:avoid}
 .brand{font-size:22px}
 .line{font-size:12px}
 .address{font-size:12px}
}
</style>
</head>
<body>

<div class="form">
'<div class="billhead"><div class="brand">AP SAND MANAGEMENT SYSTEM</div>'+

<label>Order ID</label>
<input id="order" placeholder="ఉదా: SAMPLE-001">

<label>Trip No</label>
<input id="trip" placeholder="ట్రిప్ నంబర్">

<label>Customer Name</label>
<input id="customer" placeholder="కస్టమర్ పేరు">

<label>Customer Mobile No</label>
<input id="mobile" type="tel" placeholder="ఫోన్ నంబర్">

<label>Sand Quantity</label>
<input id="qty" placeholder="ఉదా: 25 Tons">

<label>Sand Supply Point Name</label>
<input id="point" placeholder="సాండ్ సప్లై పాయింట్">

<label>Dispatch Date & Time</label>
<input id="date" type="datetime-local">

<label>Driver Name</label>
<input id="driver" placeholder="డ్రైవర్ పేరు">

<label>Driver Mobile No</label>
<input id="dmobile" type="tel" placeholder="డ్రైవర్ ఫోన్ నంబర్">

<label>Vehicle No</label>
<input id="vehicle" placeholder="వాహనం నంబర్">

<label>Address</label>
<textarea id="address" rows="3" placeholder="చిరునామా"></textarea>

<div class="no-print">
<button onclick="makeBill()">బిల్లు తయారు చేయి</button>
<button onclick="window.print()">ప్రింట్ / PDF</button>
<button onclick="clearForm()">కొత్త బిల్లు</button>
</div>
</div>

<div id="result"></div>

<script>
function val(id){
 return document.getElementById(id).value.trim();
}
function esc(s){
 return s.replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
 });
}
function line(label,value){
 return '<div class="line"><span class="key">'+label+
 '</span><span class="val">'+esc(value||'-')+'</span></div>';
}
function makeCopy(copyName){
 let d=val('date');
 if(d) d=d.replace('T',' ');
 return '<section class="bill">'+
 '<div class="billhead"><div class="brand">SAND BILL</div>'+
 '<div>DELIVERY DETAILS</div><div class="copy">'+copyName+
 '</div></div><div class="sample">SAMPLE — NOT OFFICIAL</div>'+
 line('Order ID',val('order'))+
 line('Trip No',val('trip'))+
 line('Customer Name',val('customer'))+
 line('Customer Mobile No',val('mobile'))+
 line('Sand Quantity',val('qty'))+
 line('Sand Supply Point',val('point'))+
 line('Dispatch Date',d)+
 line('Driver Name',val('driver'))+
 line('Driver Mobile No',val('dmobile'))+
 line('Vehicle No',val('vehicle'))+
 '<div class="address"><b>Address:</b> '+esc(val('address')||'-')+
 '</div></section>';
}
function makeBill(){
 document.getElementById('result').innerHTML=
 makeCopy('Consumer Copy')+makeCopy('Driver Copy');
}
function clearForm(){
 document.querySelectorAll('.form input,.form textarea').forEach(e=>e.value='');
 document.getElementById('result').innerHTML='';
 window.scrollTo(0,0);
}
makeBill();
</script>
</body>
</html>
